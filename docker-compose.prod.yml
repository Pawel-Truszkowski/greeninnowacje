# Demo deployment (Mikrus 2.0, 1 GB RAM, Docker). TLS is terminated by the provider's
# proxy, so there is no Caddy here — the app listens on the port assigned to the VPS.
# Full production hardening (Caddy, backups, CSP/HSTS) belongs to M4.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-greeninnowacje}
      POSTGRES_USER: ${POSTGRES_USER:-greeninnowacje}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD w .env}
    # Defaults assume a machine with several gigabytes; these fit a 1 GB VPS.
    command: >
      postgres
      -c shared_buffers=64MB
      -c effective_cache_size=256MB
      -c work_mem=4MB
      -c max_connections=20
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 320M

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-greeninnowacje}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-greeninnowacje}
    command: /app/deploy/entrypoint.sh
    ports:
      # Left side: the public port assigned by the provider (APP_PORT in .env).
      - "${APP_PORT}:${APP_PORT}"
    volumes:
      - staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 480M

  cron:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-greeninnowacje}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-greeninnowacje}
    command: supercronic /app/deploy/crontab
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 160M

volumes:
  pgdata:
  staticfiles:
