<svg class="weather-svg" viewBox="0 0 {{ width }} {{ label_y|add:4 }}" role="img"
     aria-label="Opady w ostatnich dniach">
  {% for bar in bars %}
    <rect x="{{ bar.x }}" y="{{ bar.y }}" width="{{ bar.width }}" height="{{ bar.height }}" rx="3"
          class="bar{% if bar.missing %} bar-missing{% elif bar.dry %} bar-dry{% endif %}">
      <title>{{ bar.label|date:"j E" }}: {% if bar.missing %}brak danych{% else %}{{ bar.value }} mm{% endif %}</title>
    </rect>
    {% comment %}Rotation as an SVG attribute, not CSS: Safari on iOS does not reliably honour transform-box: fill-box, and rotates every label around the chart's origin instead of its own box — the labels fan out diagonally.{% endcomment %}
    <text x="{{ bar.label_x }}" y="{{ label_y }}" class="bar-label" text-anchor="end"
          transform="rotate(-45 {{ bar.label_x }} {{ label_y }})">{{ bar.label|date:"d.m" }}</text>
  {% endfor %}
</svg>
