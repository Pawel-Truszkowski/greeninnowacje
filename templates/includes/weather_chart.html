<div class="weather-chart">
  <svg class="weather-svg" viewBox="0 0 {{ width }} {{ chart_height }}" preserveAspectRatio="none"
       role="img" aria-label="Opady w ostatnich dniach">
    <defs>
      <linearGradient id="rain-gradient" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#64b5f6"/>
        <stop offset="100%" stop-color="#1976d2"/>
      </linearGradient>
    </defs>
    {% for bar in bars %}
      <path d="{{ bar.path }}"
            class="bar{% if bar.missing %} bar-missing{% elif bar.dry %} bar-dry{% endif %}">
        <title>{{ bar.label|date:"j E" }}: {% if bar.missing %}brak danych{% else %}{{ bar.value }} mm{% endif %}</title>
      </path>
    {% endfor %}
  </svg>
  <ul class="weather-labels">
    {% for bar in bars %}<li>{{ bar.label|date:"d.m" }}</li>{% endfor %}
  </ul>
</div>
