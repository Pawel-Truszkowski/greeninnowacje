{# E-mail, not a page: inline style= is required here. Gmail strips <style> blocks and a
   mail client has no CSP, so the repo's "no inline styles" rule does not apply to
   templates/emails/. Tables and inline styles are the portable way to lay out an e-mail. #}
<!doctype html>
<html lang="pl">
<body style="margin:0;padding:24px;background:#f4f7f4;font-family:Arial,Helvetica,sans-serif;color:#1c2b22;">
  <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:12px;">
    <tr>
      <td style="padding:24px;">
        <p style="margin:0 0 16px;font-size:20px;font-weight:bold;color:#135133;">
          Twoje drzewa czekają na Ciebie 💧
        </p>
        <p style="margin:0 0 20px;font-size:15px;line-height:1.5;">
          Cześć {{ name }}! Ostatnie dni były suche — poniższe drzewa przydałoby się podlać.
        </p>

        <table role="presentation" cellpadding="0" cellspacing="0" width="100%">
          {% for tree in trees %}
          <tr>
            <td style="padding:10px 12px;border-left:4px solid #c0392b;background:#fdf3f2;">
              <a href="{{ tree.url }}" style="color:#135133;font-size:15px;font-weight:bold;text-decoration:none;">{{ tree.species }}</a>
              <span style="display:block;font-size:13px;color:#5b6b61;">{{ tree.locality }}</span>
            </td>
          </tr>
          <tr><td style="height:8px;line-height:8px;">&nbsp;</td></tr>
          {% endfor %}
        </table>

        <p style="margin:12px 0 20px;font-size:14px;line-height:1.5;color:#5b6b61;">
          Po podlaniu otwórz kartę drzewa i kliknij „Oznacz jako podlane" — status zmieni się od razu.
        </p>
        <p style="margin:0 0 20px;">
          <a href="{{ my_trees_url }}" style="display:inline-block;padding:12px 20px;background:#135133;color:#ffffff;font-size:15px;border-radius:8px;text-decoration:none;">Zobacz moje drzewa</a>
        </p>
        <p style="margin:0;font-size:13px;color:#5b6b61;">
          Dziękujemy, że o nie dbasz! 🌱<br>Green Innowacje
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
