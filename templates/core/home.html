{% extends "base.html" %}
{% block title %}Mapa drzew{% endblock %}
{% block content %}
<main class="page">
  <div class="card empty-state">
    <div class="art">🌳</div>
    <h1>Mapa drzew już wkrótce</h1>
    {% if user.is_authenticated %}
      <p class="muted">Jesteś zalogowany(-a) jako <b>{{ user.display_name }}</b>.</p>
    {% else %}
      <p class="muted"><a href="{% url 'accounts:login' %}">Zaloguj się</a> lub <a href="{% url 'accounts:register' %}">załóż konto</a>, aby opiekować się drzewami.</p>
    {% endif %}
  </div>
</main>
{% endblock %}
